openapi: 3.1.0
info:
  title: Entities API - REST
  version: 1.2.0
  description: |
    REST API for managing entities.
    
    This API provides CRUD operations for entities with the following properties:
    - id: unique identifier (auto-generated)
    - name: string, required, trimmed
    - size: non-negative number, optional; zero is valid and null input is treated as absent
    
    All endpoints follow REST conventions and return JSON responses.
servers:
  - url: /
    description: Current host
  - url: http://magdich.cloud:3000
# Public by default; PATCH /training-config overrides this with the admin token
security: []
paths:
  /entities:
    get:
      tags:
        - Entities
      summary: Get all entities
      description: Retrieve a list of all stored entities
      operationId: getAllEntities
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
                example:
                  - id: 1
                    name: "Sample Entity"
                    size: 10
                  - id: 2
                    name: "Another Entity"
    post:
      tags:
        - Entities
      summary: Create a new entity
      description: Create a new entity with name and optional size
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
            example:
              name: "New Entity"
              size: 15
      responses:
        '201':
          description: Entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing 'name' property"

  /entities/{id}:
    get:
      tags:
        - Entities
      summary: Get entity by ID
      description: Retrieve a single entity by its unique identifier
      operationId: getEntityById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the entity
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Entity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Entity not found"
    
    put:
      tags:
        - Entities
      summary: Update entity
      description: Replace an existing entity's name and size (omitting size or passing null removes it)
      operationId: updateEntity
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the entity to update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
            example:
              name: "Updated Entity"
              size: 20
      responses:
        '200':
          description: Entity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing 'name' property"
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Entity not found"
    
    delete:
      tags:
        - Entities
      summary: Delete entity
      description: Delete an entity by its unique identifier
      operationId: deleteEntity
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the entity to delete
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Entity deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Entity not found"

  /training-config:
    get:
      tags:
        - Training
      summary: Get training config
      description: Current training mode config. Readable without authentication.
      operationId: getTrainingConfig
      responses:
        '200':
          description: Current training config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingConfig'

    patch:
      tags:
        - Training
      summary: Update training config
      description: |
        Changes the training config at runtime (in memory only, reset on restart).
        Requires the TRAINING_ADMIN_TOKEN set on the server as a bearer token;
        without that variable, updates are disabled. Only known keys with boolean
        values are accepted; anything else is rejected and leaves the config unchanged.
      operationId: updateTrainingConfig
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingConfigUpdate'
            example:
              enabled: true
              features:
                skipTrimOnCreate: false
      responses:
        '200':
          description: Updated training config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingConfig'
        '400':
          description: Invalid update (unknown key or non-boolean value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Unknown property 'evil'"
        '401':
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Missing or invalid admin token"
        '429':
          description: Too many failed token attempts from this client (5 within 15 minutes); blocked until the window ends, even with the right token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Too many failed admin token attempts, try again later"
        '403':
          description: Runtime updates disabled (no TRAINING_ADMIN_TOKEN on the server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Runtime training config updates are disabled"

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Value of TRAINING_ADMIN_TOKEN
  schemas:
    Entity:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique identifier auto-generated by the service
          example: 1
        name:
          type: string
          description: Name of the entity, leading/trailing whitespace is trimmed
          example: "Sample Entity"
          minLength: 1
        size:
          type: number
          description: Optional non-negative number representing size; omitted when absent
          example: 10
          minimum: 0
      example:
        id: 1
        name: "Sample Entity"
        size: 10
    
    EntityInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the entity, must be non-empty after trimming
          example: "New Entity"
          minLength: 1
        size:
          type: [number, 'null']
          description: Optional non-negative number; zero is valid, and null is treated as absent
          example: 15
          minimum: 0
      example:
        name: "New Entity"
        size: 15

    TrainingConfig:
      type: object
      required:
        - enabled
        - features
      properties:
        enabled:
          type: boolean
          description: Whether training mode (intentional bugs) is on
        features:
          type: object
          additionalProperties: false
          properties:
            skipTrimOnCreate:
              type: boolean
              description: Skip trimming the name on create (30% chance)
            skipTrimOnUpdate:
              type: boolean
              description: Skip trimming the name on update (25% chance)
          required:
            - skipTrimOnCreate
            - skipTrimOnUpdate
      example:
        enabled: true
        features:
          skipTrimOnCreate: true
          skipTrimOnUpdate: true

    TrainingConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        features:
          type: object
          additionalProperties: false
          properties:
            skipTrimOnCreate:
              type: boolean
              description: Skip trimming the name on create (30% chance)
            skipTrimOnUpdate:
              type: boolean
              description: Skip trimming the name on update (25% chance)

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

tags:
  - name: Entities
    description: Entity management operations
  - name: Training
    description: Training mode configuration
